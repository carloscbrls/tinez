[build]
  command = "npm run build"
  publish = "dist"

# Optional: FantasyNerds API for expert IDP projections
#   FANTASYNERDS_API_KEY — Get from fantasynerds.com after signup
#   Without this, IDP projections use the TINEZ statistical model only

# ESPN Fantasy API (public, no approval needed)
[[redirects]]
  from = "/api/espn/*"
  to = "/.netlify/functions/espn/:splat"
  status = 200

[[redirects]]
  from = "/api/espn"
  to = "/.netlify/functions/espn"
  status = 200
